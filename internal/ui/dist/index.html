<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>总览 · Overseer</title>
    <link rel="icon" href="img/overseer.svg" type="image/svg+xml" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <div id="page-content" hidden>
        <div class="boundary-banner">
          近 24 小时审查统计来自本地记录；详细过程在「审查记录 → 日志」查看。
        </div>

        <div class="row g-3 mb-3" id="stat-row">
          <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">VCS 实例</div><div class="value" id="s-instances">-</div><div class="hint">GitLab / GitHub / Gitea</div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">已开启 Review</div><div class="value" id="s-enabled">-</div><div class="hint">仓库数</div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">近 24h 触发</div><div class="value" id="s-triggers">-</div><div class="hint">含跳过 / 失败</div></div></div>
          <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">近 24h 成功率</div><div class="value" id="s-rate">-</div><div class="hint" id="s-mode-hint">-</div></div></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>最近触发</h2>
            <a class="btn btn-sm btn-outline-secondary" href="reviews.html">查看全部</a>
          </div>
          <div class="table-wrap">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr><th>仓库</th><th>MR / PR</th><th>状态</th><th>时间</th></tr>
              </thead>
              <tbody id="recent-body">
                <tr><td colspan="4" class="text-secondary">加载中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      CR.mountShell("overview", "总览");
      (async () => {
        const data = await CR.apiGet("/api/overview");
        document.getElementById("s-instances").textContent = data.instance_count;
        document.getElementById("s-enabled").textContent = data.review_enabled;
        document.getElementById("s-triggers").textContent = data.triggers_24h;
        document.getElementById("s-rate").textContent =
          data.triggers_24h > 0 ? Math.round(data.success_rate_24h * 100) + "%" : "-";
        document.getElementById("s-mode-hint").textContent =
          (data.mode_note || "Agent") +
          " · 均耗时 " +
          (data.avg_duration_sec > 0 ? data.avg_duration_sec + "s" : "-");
        document.getElementById("recent-body").innerHTML = (data.recent || [])
          .map(
            (r) => `<tr>
              <td class="mono">${CR.escapeHtml(r.repo)}</td>
              <td>${CR.escapeHtml(r.mr)}</td>
              <td>${CR.statusBadge(r.status)}</td>
              <td class="text-secondary">${CR.escapeHtml(r.at)}</td>
            </tr>`
          )
          .join("");
      })().catch((e) => CR.showToast(String(e), "danger"));
    </script>
  </body>
</html>
