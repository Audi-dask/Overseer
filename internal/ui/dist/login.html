<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Overseer</title>
    <link rel="icon" href="img/overseer.svg" type="image/svg+xml" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <style>
      .login-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.18), transparent 40%),
          radial-gradient(circle at 80% 0%, rgba(148, 163, 184, 0.25), transparent 35%),
          #f1f5f9;
        padding: 1.5rem;
      }
      .login-card {
        width: min(420px, 100%);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 1.75rem;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }
      .login-brand {
        font-weight: 700;
        font-size: 1.25rem;
        margin-bottom: 0.25rem;
      }
      .login-sub {
        color: #64748b;
        font-size: 0.9rem;
        margin-bottom: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <form class="login-card" id="login-form">
        <div class="login-brand">Overseer</div>
        <div class="login-sub" id="login-sub">代码审查控制台</div>
        <div class="mb-3">
          <label class="form-label" for="username">用户名</label>
          <input class="form-control" id="username" value="admin" autocomplete="username" required />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">密码</label>
          <input class="form-control" id="password" type="password" autocomplete="current-password" required minlength="6" />
        </div>
        <div class="mb-3 d-none" id="password2-wrap">
          <label class="form-label" for="password2">确认密码</label>
          <input class="form-control" id="password2" type="password" autocomplete="new-password" minlength="6" />
        </div>
        <button class="btn btn-primary w-100" type="submit" id="submit-btn">登录</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      let setupRequired = false;

      (async () => {
        if (CR.getToken()) {
          try {
            await CR.apiGet("/api/auth/me");
            location.href = "index.html";
            return;
          } catch {
            CR.clearToken();
          }
        }
        const st = await fetch("/api/auth/status").then((r) => r.json());
        setupRequired = !!st.setup_required;
        document.getElementById("username").value = st.username || "admin";
        if (setupRequired) {
          document.getElementById("login-sub").textContent = "首次使用：设置管理员账号";
          document.getElementById("password2-wrap").classList.remove("d-none");
          document.getElementById("password2").required = true;
          document.getElementById("submit-btn").textContent = "完成初始化并进入";
          document.getElementById("password").autocomplete = "new-password";
        }
      })().catch((e) => CR.showToast(String(e), "danger"));

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        if (setupRequired) {
          const password2 = document.getElementById("password2").value;
          if (password !== password2) {
            CR.showToast("两次密码不一致", "danger");
            return;
          }
        }
        try {
          const path = setupRequired ? "/api/auth/setup" : "/api/auth/login";
          const res = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({ username, password }),
          });
          if (!res.ok) throw new Error(await CR.errorText(res));
          const data = await res.json();
          CR.setToken(data.token);
          location.href = "index.html";
        } catch (err) {
          CR.showToast(String(err.message || err), "danger");
        }
      });
    </script>
  </body>
</html>
