<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>审查提示词 · Overseer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app-v2.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <div id="page-content" hidden>
        <div class="boundary-banner">
          Agent 唯一审查策略；保存后下次审查生效。变量 <code>{{diff}}</code> 不展开。
        </div>

        <div class="panel mb-3">
          <div class="panel-header">
            <h2>可用变量</h2>
          </div>
          <div class="p-3 d-flex flex-wrap gap-2" id="var-chips"></div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>默认审查提示词</h2>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-reset">恢复默认</button>
              <button type="button" class="btn btn-sm btn-primary" id="btn-save">保存</button>
            </div>
          </div>
          <div class="p-3">
            <label class="form-label" for="prompt-name">模板名称</label>
            <input class="form-control mb-3" id="prompt-name" />
            <label class="form-label" for="prompt-editor">提示词正文</label>
            <textarea class="form-control" id="prompt-editor" spellcheck="false"></textarea>
            <div class="form-text mt-2">
              写「审什么、怎么分级、用什么语气」即可；不要写整篇 Markdown 报告模板或「第一行【总结】」——
              Agent 通过工具提交结构化评论，报告外壳由服务生成。保存后下次审查立即生效，无需重启。
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app-v2.js"></script>
    <script>
      CR.mountShell("prompts", "审查提示词");

      let defaultBody = "";

      function renderVars(vars) {
        document.getElementById("var-chips").innerHTML = (vars || [])
          .map(
            (v) =>
              `<span class="badge text-bg-light border var-chip" title="${CR.escapeHtml(v.desc || "")}">${CR.escapeHtml(v.name)}</span>`
          )
          .join("");
      }

      (async () => {
        const data = await CR.apiGet("/api/prompts");
        defaultBody = data.default_body || data.body || "";
        document.getElementById("prompt-name").value = data.name || "默认审查提示词";
        document.getElementById("prompt-editor").value = data.body || defaultBody;
        renderVars(data.variables);
      })().catch((e) => CR.showToast(String(e), "danger"));

      document.getElementById("btn-reset").addEventListener("click", () => {
        document.getElementById("prompt-editor").value = defaultBody;
        CR.showToast("已恢复为默认模板（未保存）", "success");
      });

      document.getElementById("btn-save").addEventListener("click", async () => {
        try {
          await CR.apiSend("PUT", "/api/prompts", {
            name: document.getElementById("prompt-name").value,
            body: document.getElementById("prompt-editor").value,
          });
          CR.showToast("提示词已保存", "success");
        } catch (err) {
          CR.showToast(String(err.message || err), "danger");
        }
      });
    </script>
  </body>
</html>
