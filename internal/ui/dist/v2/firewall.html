<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>审查防火墙 · Overseer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="css/app-v2.css" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <div id="page-content" hidden>
        <div class="boundary-banner">
          <code>.gitignore</code> 语法排除文件不进模型；<code>!</code> 可重新放行。
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <div class="stat-card">
              <div class="label">有效规则行</div>
              <div class="value" id="rule-count">-</div>
              <div class="hint">不含空行与注释</div>
            </div>
          </div>
          <div class="col-md-8">
            <div class="stat-card">
              <div class="label">语法速查</div>
              <div class="hint mb-0 syntax-reference">
                <code>*</code> 通配　<code>**</code> 跨目录　<code>/</code> 锚定路径　
                <code>!</code> 反选（例外放行）　<code>#</code> 注释
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>忽略规则</h2>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-reset">恢复默认</button>
              <button type="button" class="btn btn-sm btn-primary" id="btn-save">保存</button>
            </div>
          </div>
          <div class="p-3">
            <textarea class="form-control" id="firewall-editor" spellcheck="false" placeholder="# 一行一条规则"></textarea>
            <div class="form-text mt-2">
              取 diff 后、拼 prompt 前过滤。典型排除：锁文件、生成代码、静态资源、密钥与大体量数据。
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app-v2.js"></script>
    <script>
      CR.mountShell("firewall", "审查防火墙");

      let defaultRules = "";

      function countRules(text) {
        return text
          .split("\n")
          .map((l) => l.trim())
          .filter((l) => l && !l.startsWith("#")).length;
      }

      function syncCount() {
        document.getElementById("rule-count").textContent = countRules(
          document.getElementById("firewall-editor").value
        );
      }

      (async () => {
        const data = await CR.apiGet("/api/firewall");
        defaultRules = data.default_rules || data.rules || "";
        document.getElementById("firewall-editor").value = data.rules || defaultRules;
        syncCount();
      })().catch((e) => CR.showToast(String(e), "danger"));

      document.getElementById("firewall-editor").addEventListener("input", syncCount);

      document.getElementById("btn-reset").addEventListener("click", () => {
        document.getElementById("firewall-editor").value = defaultRules;
        syncCount();
        CR.showToast("已恢复默认规则（未保存）", "success");
      });

      document.getElementById("btn-save").addEventListener("click", async () => {
        try {
          await CR.apiSend("PUT", "/api/firewall", {
            rules: document.getElementById("firewall-editor").value,
          });
          CR.showToast("审查防火墙已保存", "success");
        } catch (err) {
          CR.showToast(String(err.message || err), "danger");
        }
      });
    </script>
  </body>
</html>
