services:
  overseer:
    image: ${OVERSEER_IMAGE:-ccr.ccs.tencentyun.com/audi-dask/overseer:latest}
    container_name: overseer
    ports:
      - "${PORT:-8080}:8080"
    environment:
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: "8080"
      DB_PATH: /data/overseer.db
      WORKSPACE_DIR: /data/workspaces
      REVIEW_LOG_DIR: /data/reviewlogs
    volumes:
      - overseer-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  overseer-data:
